syntax = "proto3";

package chipcheck.console.v1;

// Browser-facing contract for the first configuration-to-proposals milestone.
// This API does not arm a fixture, approve a candidate, or start a campaign.
service ConsoleService {
  rpc PreviewProposedTests(PreviewProposedTestsRequest) returns (PreviewProposedTestsResponse);
}

message PreviewProposedTestsRequest {
  TestSetup setup = 1;
  string method = 2; // tpe, random, or grid
  uint32 seed = 3;
  uint32 count = 4;
  repeated MeasuredResult history = 5;
  uint32 warmup_trials = 6;
}

message TestSetup {
  string name = 1;
  string dut = 2;
  string firmware = 3;
  string fixture = 4;
  string wiring = 5;
  VariableRail rail = 6;
  string led_states = 7;
  string workloads = 8;
  uint32 settle_ms = 9;
  uint32 duration_ms = 10;
  string observations = 11;
  string requirement = 12;
  string forbidden_combinations = 13;
  SafetyBounds safety = 14;
  uint32 experiment_budget = 15;
  repeated string red_led_options = 16;
  repeated string green_led_options = 17;
  repeated string workload_options = 18;
  repeated VariableRail additional_rails = 19;
}

message VariableRail {
  string name = 1;
  double minimum_volts = 2;
  double maximum_volts = 3;
  double step_volts = 4;
}

message SafetyBounds {
  double maximum_volts = 1;
  double maximum_amps = 2;
  double maximum_celsius = 3;
  string safe_return_state = 4;
}

message PreviewProposedTestsResponse {
  ProposalSource source = 1;
  string setup_name = 2;
  repeated ProposedTest tests = 3;
  string method = 4;
  uint32 history_used = 5;
}

enum ProposalSource {
  PROPOSAL_SOURCE_UNSPECIFIED = 0;
  PROPOSAL_SOURCE_MOCK = 1;
  PROPOSAL_SOURCE_BACKEND = 2;
  PROPOSAL_SOURCE_DECISION = 3;
}

message ProposedTest {
  string id = 1;
  string title = 2;
  string purpose = 3;
  repeated string requested = 4;
  repeated string expected_observations = 5;
  ProposedConditions conditions = 6;
  string reason = 7;
}

message ProposedConditions {
  double rail_volts = 1;
  string red_led = 2;
  string green_led = 3;
  string workload = 4;
  optional double sensor_rail_volts = 5;
}

message MeasuredResult {
  ProposedConditions conditions = 1;
  string outcome = 2;
  optional double robustness = 3;
}
