name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU only; the optional GP planner tests skip without torch)
        run: pip install -e ".[dev]"
      - name: Unit, property and full-stack tests
        run: python -m unittest discover -s activequal -t .
      - name: Bench acceptance self-test against the MCU emulator
        run: python -m activequal.tools.hardware_check --emulator --energize

  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: activequal/console/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: activequal/console/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
