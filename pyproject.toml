[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activequal"
version = "0.1.0"
description = "ActiveQual: AI-driven adaptive physical testing for embedded systems"
requires-python = ">=3.12"
dependencies = [
    "optuna>=4.0,<5",
]

[project.optional-dependencies]
# The `gp` planner. The CPU wheel of torch avoids ~3 GB of CUDA libraries:
#   pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[gp]"
gp = ["torch>=2.2", "scipy>=1.11"]
dev = ["hypothesis>=6"]
serial = ["pyserial>=3.5"]

[project.scripts]
control-plane = "activequal.service.app:main"
bench = "activequal.controller.service.app:main"

[tool.setuptools.packages.find]
include = ["activequal*"]
exclude = ["activequal.console*"]
